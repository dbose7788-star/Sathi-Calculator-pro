name: Build Sathi Soft Modem

on:
  workflow_dispatch:
  push:
    branches:
      - radio-walkie

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.sathi .

      - name: Configure Android identity
        run: |
          sed -i 's/android:label="[^"]*"/android:label="Sathi Soft Modem"/' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_sathi_softmodem"#' android/app/src/main/AndroidManifest.xml
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_sathi_softmodem.xml <<'ICON'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path android:fillColor="#081018" android:pathData="M0,0h108v108h-108z"/>
              <path android:fillColor="#00E5FF" android:pathData="M51,18h6v54h-6z"/>
              <path android:fillColor="#00E5FF" android:pathData="M38,72h32v6h-32z"/>
              <path android:fillColor="#00E5FF" android:pathData="M43,84h22v6h-22z"/>
              <path android:fillColor="#00E5FF" android:pathData="M29,48h8v8h-8z"/>
              <path android:fillColor="#00E5FF" android:pathData="M71,48h8v8h-8z"/>
              <path android:fillColor="#00E5FF" android:pathData="M20,36h6v30h-6z"/>
              <path android:fillColor="#00E5FF" android:pathData="M82,36h6v30h-6z"/>
            </vector>
          ICON

      - name: Configure permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sathi-soft-modem-apk
          path: build/app/outputs/flutter-apk/app-release.apk
