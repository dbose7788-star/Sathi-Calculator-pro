name: Build Sathi APK

on:
  workflow_dispatch:
  push:
    branches:
      - radio-walkie

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Create Android project
        run: flutter create --platforms=android --org com.sathi .

    - name: Configure Soft Modem identity
      run: |
        sed -i 's/android:label="[^"]*"/android:label="Sathi Soft Modem"/' android/app/src/main/AndroidManifest.xml
        if [ -f android/app/build.gradle.kts ]; then
          sed -i 's/applicationId = "[^"]*"/applicationId = "com.sathi.softmodem"/' android/app/build.gradle.kts
          sed -i 's/namespace = "[^"]*"/namespace = "com.sathi.softmodem"/' android/app/build.gradle.kts
        elif [ -f android/app/build.gradle ]; then
          sed -i 's/applicationId "[^"]*"/applicationId "com.sathi.softmodem"/' android/app/build.gradle
          sed -i 's/namespace "[^"]*"/namespace "com.sathi.softmodem"/' android/app/build.gradle
          sed -i 's/namespace = "[^"]*"/namespace = "com.sathi.softmodem"/' android/app/build.gradle
        fi

      - name: Configure Soft Modem icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          printf "%s
" "<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#00E5FF" android:pathData="M54,12 L54,72 M35,72 L73,72 M42,84 L66,84 M28,60 L80,60 M35,48 L73,48 M42,36 L66,36 M48,24 L60,24"/></vector>" > android/app/src/main/res/drawable/ic_sathi_softmodem.xml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/ic_sathi_softmodem"#' android/app/src/main/AndroidManifest.xml

      - name: Configure Android permissions
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.RECORD_AUDIO"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sathi-radio-walkie-apk
          path: build/app/outputs/flutter-apk/app-release.apk
